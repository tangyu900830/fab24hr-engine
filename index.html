.nogl{position:fixed;top:64px;left:16px;right:16px;z-index:3;font-size:13.5px;color:var(--muted)}
@media (min-width:860px){
  .clockbox{flex:0 1 auto;flex-direction:row;align-items:baseline;gap:12px}
  .clock{font-size:30px}.clock-note{font-size:13.5px}
  .panel{left:auto;right:16px;top:calc(70px + env(safe-area-inset-top,0px));bottom:16px;width:410px;max-height:none;border:1px solid var(--line);border-radius:8px}
  .home{justify-content:flex-start;padding-left:max(24px,5vw);background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 82%,transparent) 0,color-mix(in srgb,var(--bg) 40%,transparent) 55%,transparent 80%)}
  .keys .kb{display:block}
  .dpad{bottom:16px}
  .talk-btn{left:176px;right:auto;bottom:65px}
  .dlg{bottom:24px}
}
@media (max-width:400px){.hud{padding-left:10px;padding-right:10px;gap:6px}.hud .btn-ghost{padding:5px 8px}.meters{gap:4px}.clock{font-size:20px}.snd{min-width:32px;padding:5px 5px}}
@media (max-width:340px){.hud{gap:4px}.clock-note{font-size:11px}.hud .btn-ghost{padding:5px 6px;font-size:13.5px}.snd{min-width:28px;padding:5px 3px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#end.pic .board{height:100%}
.board .scroll>.endpic{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.endpic img{display:block;flex:1 1 auto;min-height:0;max-width:100%;width:auto;height:auto;aspect-ratio:9/16;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.endpic-wait{flex:1 1 auto;display:grid;place-items:center;width:100%;margin:0;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13.5px}
.endpic-tip{flex:none;margin:0;font-size:12.5px;color:var(--muted);text-align:center}

.cardv{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.cardv-win{display:flex;flex-direction:column;width:min(420px,100%);max-height:100%;border:1px solid var(--ink);border-radius:8px;background:var(--surface);overflow:hidden}
.cardv-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.cardv-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cardv-body img{display:block;width:min(100%,250px);aspect-ratio:9/16;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.cardv-body p{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted);align-self:stretch}
.cardv-foot{flex:none;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.cardv-foot .btn{flex:1 1 0;text-align:center;text-decoration:none}
.end-stats .of{font-size:.7em;opacity:.6;margin-left:2px}

說「我的客戶也有這個需求」。"},dani:{name:"Dani",role:"海外經銷商窗口",tag:"經銷",color:"#9a7a2f",about:"在東南亞幫棲光賣設備。說話直接，很清楚當地客戶要什麼價格。只用電話和 email 出現。"},tina:{name:"Tina",role:"人資（HR）",tag:"HR",color:"#3d8f7a",about:"人力資源部門。平常負責入職、薪資與請假，說話輕、條理清楚。你只會在最不想見到她的那天，才真的跟她說上話。"},owen:{name:"Owen",role:"機殼廠業務",tag:"供應商",color:"#4a7f2b",about:"合作的機殼加工廠業務。開模、CNC 加工、打樣的價格與交期都找他。習慣先報一個最高的價，再看你怎麼回。只用電話出現。"},cora:{name:"Cora",role:"客戶・採購與專案窗口",tag:"客戶",color:"#5d6d77",about:"智慧倉儲自走車公司的採購兼專案負責人。很懂行情，禮貌，但一定會殺價。技術細節要你直接跟她說，Kai 轉述不清楚。只用電話與視訊出現。"},huang:{name:"Mr. Huang",role:"終端客戶・廠務主管",tag:"客戶",color:"#5d6d77",about:"真的在用這批設備的人。他不管誰的錯，他只要設備能開機。"},mia:{name:"Mia",role:"財務",tag:"財務",color:"#2a8a8a",about:"管報價核准後的帳。說話很快，喝咖啡的時間很短。"},jay:{name:"Jay",role:"採購",tag:"採購",color:"#8a6a2a",about:"跟供應商殺價殺了十年。愛開玩笑，嘴上很鬆。"},ella:{name:"Ella",role:"品保",tag:"品保",color:"#5a7fa0",about:"產品出貨前最後一道關。看起來嚴肅，其實很愛聊天。"},sam:{name:"Sam",role:"資訊",tag:"資訊",color:"#4a6a8a",about:"公司的電腦與網路都找他。每天最早到，咖啡一定喝兩杯。"},ben:{name:"Ben",role:"倉管",tag:"廠務",color:"#c07a2a",about:"倉庫的帳與貨，他都記在腦子裡。"},joe:{name:"Joe",role:"產線作業員",tag:"廠務",color:"#c07a2a",about:"在產線上組裝，也負責把成品搬進倉庫。"},sue:{name:"Sue",role:"產線作業員",tag:"廠務",color:"#c07a2a",about:"在產線上組裝，也負責把物料領進工廠。"},max:{name:"Max",role:"插車司機",tag:"廠務",color:"#c07a2a",about:"開電動插車，把整棧板的成品從工廠運進倉庫。"},dan:{name:"Dan",role:"插車司機",tag:"廠務",color:"#c07a2a",about:"開電動插車，把整棧板的物料從倉庫運進工廠。"},ray:{name:"Ray",role:"產線領班",tag:"廠務",color:"#c07a2a",about:"管產線的領班，嗓門大，什麼事都說得很好笑。"},kim:{name:"Kim",role:"產線作業員",tag:"廠務",color:"#c07a2a",about:"在產線上做檢查，也是領班最愛的聊天對象。"},tom:{name:"Tom",role:"韌體工程師",tag:"RD",color:"#7a4fd6",about:"寫韌體，講話很慢，打字很快。座位旁邊永遠有三罐能量飲料。"},anna:{name:"Anna",role:"客服",tag:"客服",color:"#d6702b",about:"每天接最多電話的人。聲音很甜，脾氣其實很大。"},ken:{name:"Ken",role:"業務助理",tag:"業務",color:"#d6502b",about:"幫業務跑單、對帳、訂便當。全公司最早知道誰要請客。"},lily:{name:"Lily",role:"採購助理",tag:"採購",color:"#8a6a2a",about:"下單、催貨、對發票。一邊做事一邊聽八卦，兩樣都不漏。"},bo:{name:"Bo",role:"測試工程師",tag:"QA",color:"#5a7fa0",about:"專門把東西弄壞的人。看到按鈕就想按。"},vera:{name:"Vera",role:"法務",tag:"法務 ["終端客戶","最後真正使用設備的公司。他們通常不認識棲光，只認識 SI。"],["DC 圓頭線 / DC 圓頭 / DC plug","一種傳統的圓形小插頭電源線，很多電子設備用它供電。"],["Type-C","一種扁扁的、正反都能插的插頭。現在很多手機、筆電、平板都用它來充電。"],["轉接頭","把一種插頭轉成另一種插頭的小配件。"],["規格表","把產品的尺寸、接頭、供電方式這些細節寫清楚的一張表。出貨前要靠它確認有沒有搞錯。"],["業務","負責跟客戶談生意、接訂單的同事。他們最了解客戶要什麼，也最常第一個接到客戶的抱怨。"],["RD / 研發","研發工程師，負責把產品設計出來：電路、韌體、結構。"],["電腦 Team","負責跟棲光產品搭配的工業電腦與平板的團隊。他們手上有樣品和測試台，可以驗證線材、配件能不能真的用。"],["打樣","正式量產之前，先做少量樣品出來試。確定沒問題，才下大量訂單。"],["MOQ","最小訂購量。廠商規定「至少要買這麼多」才肯做，量太少他們不接。"],["報價","廠商或我們開出的價格。通常會依數量、規格和交期不同。"],["PD / Power Delivery","Type-C 上的一種充電協定，可以讓電源和設備先「談好」要送多少電，最高到幾十瓦。"],["e-marker","藏在高功率 Type-C 線裡的小晶片，告訴設備「這條線撐得住大電流」。沒有它，設備會把充電功率降下來保命。"],["賠償","因為我們的錯，客戶遭受的損失由我們負責補償，通常是錢。"],["回收","把已經出貨的東西收回來，換成正確的。成本高，但最乾淨。"],["樣品機 / 實機","真正的設備本體。規格表上寫的數字，最後要拿實機接上去量過，才算數。"],["量產","開始大量製造。打樣沒問題之後，才會進入量產。"],["data sheet / 規格書","產品的正式規格文件，每一項規格、接頭、供電範圍都寫在裡面，由 PM 和 RD 維護。內容完整，但業務要在客戶電話裡快速查，常常嫌它太長。"],["EVT","工程驗證。新產品的第一關：做出少量工程樣品，目的是找問題，不是證明沒問題。"],["DVT","設計驗證。EVT 的問題修完之後，再做一批更接近成品的樣品，驗證設計能不能通過各種測試與認證。"],["PVT","試產。在工廠實際跑一小批，確認量產的流程順不順、品質穩不穩。"],["MP","量產。正式開始大量生產與出貨，跟試產不同，這時候交期與品質都要穩。"],["資遣","公司因為績效或組織調整，終止勞動契約。依規定要提前通知，並給資遣費。通常由主管說明原因，人資負責辦手續。"],["HR / 人資","人力資源部門。負責招募、薪資、請假，也負責離職與資遣的手續。"],["八卦指數","你在茶水間聽了多少八卦。聽得少，什麼都不知道；聽得多，有時能拿到有用的資訊，有時同事會覺得你太愛打聽。"],["客製 / 客製化","依照單一客戶的需求，修改標準產品的一部分：換接頭、換面板、加模組、印客戶的標誌。通常要多花一筆開發費，量要夠大才划算。"],["NRE / 開模費","一次性的開發費用，例如開模具、治具、認證。不管後來賣幾台都要付，所以要攤到每一台的價格裡。"],["毛利 / 毛利率","賣價扣掉成本剩下的錢叫毛利；毛利除以賣價就是毛利率。公司通常有一條最低線，低於它就不接。"],["殺價","客戶要求降價。常見的回法：不降但說明價值、用數量或長約換折扣、或直接降。每一種的代價不同。"],["樣品 / 工程樣品","做出來給客戶看或測試的少量機器。免費給、收費給、先給外觀模型，各有不同的成本與效果。"],["落摔測試","把包好的產品從固定高度、不同角度摔下去，看看有沒有壞。包材設計得好不好，要靠它驗證。"],["BOM / BOM 表","一台產品用到的所有零件清單與價格。看它就知道錢花在哪：通常前幾大零件就占了大部分成本。"],["老化測試 / burn-in","出貨前讓機器在高溫下長時間滿載運轉，把容易早期故障的挑出來。跑得越久，挑得越乾淨，但出貨也越晚。"],["過熱降速","處理器太熱時自動降低速度保護自己。機器沒壞，但跑得變慢。無風扇的機器特別要注意。"],["認證","特定場合（例如車載、軌道）要求的檢測證明，沒有就不能投標。要花時間也要花錢。"],["漏斗 / pipeline","把銷售拆成階段：被看到、有興趣、試用、報價、下單。每個階段都會掉一些人。拿到名片只是開始，不是接近成交。"],["SI","系統整合公司，替客戶把機器、軟體、現場設備組成一套完整方案，常是工控機的實際買家。"],["型錄","把公司所有產品的規格、照片和賣點印成（或做成檔案的）一本冊子，給業務拿去給客戶看。"],["ID / 工業設計","工業設計師。負責產品的外觀、造型和顏色，產品的 3D 渲染圖通常出自他們。"],["渲染圖","用電腦畫出來、看起來像照片的產品圖。產品還沒做出來、或不方便拍照的時候，型錄和簡報都靠它。"],["行銷","負責品牌、型錄、展覽、廣告這些「讓人知道你的產品」的同事。"],["會議紀錄","開完會後寫下來的：決議了什麼、誰負責、什麼時候要完成。寄給所有人，之後就有依據。"],["brief","給設計師或外包的一頁需求說明：要做什麼、給誰看、需要幾張、什麼時候要。寫不清楚，對方只能猜。"],["校稿","印出來之前，把稿子裡的字、數字、圖逐一對過，找錯字和錯誤的規格。"],["勘誤 / 勘誤貼紙","印出去才發現錯，只好貼一張小貼紙或附一張更正單。看起來不專業，但便宜、快。"],["書面確認 / 書面同意 / 白紙黑字","用信件或簽名文件留下的同意。口頭說「OK」，出事的時候很容易變成「我沒說過」。"]];termsSet(GLOSS," / ",[],[]);levelAdd("office",function(K){let{flat,lam,basic,M,label,screen,G}=K,TX=K.TX,B=(w,h,d,m,x,y,z,sh)=>K.box(w,h,d,m,x,y,z,G,sh);K.bounds(-34,16.2,-23,15.1);let carpet=lam(11450043,{map:TX.carpet}),carpetMt=lam(9411492,{map:TX.carpet}),marble=lam(15855853,{map:TX.tile}),tile=lam(14871528,{map:TX.tile}),oak=lam(13809807,{map:TX.wood}),walnut=lam(8016438,{map:TX.wood}),white=lam(16053231),stone=lam(3752778),steel=lam(13489368,{map:TX.panel}),alu=lam(12173766),green=lam(9285710),frost=lam(14477806,{transparent:!0,opacity:.6,depthWrite:!1}),chairM=lam(3029569),sofaM=lam(4153203),cushion=lam(5668244),rug=lam(3097944),gold=lam(14267482),potM=lam(15328474),glow=basic(10473704),jug=lam(8373480,{transparent:!0,opacity:.7,depthWrite:!1}),red=basic(16734794);K.onTheme(dk=>{carpet.color.setHex(dk?4871e3:11450043),carpetMt.color.setHex(dk?3884107:9411492),marble.color.setHex(dk?5593179:15855853),tile.color.setHex(dk?5200472:14871528),oak.color.setHex(dk?7035973:13809807)}),flat(32.4,18.4,carpet,0,0,-1,1,G),flat(10.5,10.2,marble,-10.75,.01,2.9,1,G),flat(10.5,7.8,carpetMt,-10.75,.01,-6.1,1,G),flat(5.4,5.8,tile,13.3,.01,-7.1,1,G),flat(5.4,4.7,oak,13.3,.01,-1.85,1,G),flat(5,5,tile,13.5,.01,5.5,1,G),flat(3.6,2.4,rug,-8.5,.02,6.2,1,G),[[-16.3,8.7],[10.7,16.3]].forEach(r=>{let w=r[1]-r[0],c=(r[0]+r[1])/2;B(w,.9,.3,M.wall,c,.45,-10.15),B(w,2.3,.1,M.glass,c,2.05,-10.15,!1),B(w,.2,.3,M.wall,c,3.3,-10.15)}),B(2,.9,.3,M.wall,9.7,2.75,-10.15),B(2,.1,.1,alu,9.7,2.3,-10.15);for(let x=-16;x<=16;x+=3.2)(x<8.6||x>10.8)&&B(.1,2.3,.14,alu,x,2.05 ,adp3:["Walter 看的是事實和下一步。先講發生什麼事，再講你要怎麼做。","Walter 今天特地取消了午餐行程，大家都知道事情不小。"],spl1:["客戶的機型要一個一個問，Mr. Huang 最好講話，先從他開始。","Mr. Huang 現場今天剛好有人在，電話應該打得通。"],ret1:["規格以實機為準。去找 Grace 把實機接上電表逐項量，不要只聽業務轉述。","Grace 那邊的樣品機這週剛好沒有人借。"],ret2:["線材廠報價出來，要拿給 KP 批准。MOQ 可以跟 Amy 談，不要硬碰硬。","Amy 說她們廠這個月產能有空，交期可能壓得下來。"],ret3:["線做好了，出貨前一定要用樣品機實測，不要只看標籤和長度。","聽說最近線材廠有一批線被品保退貨，大家都在小心。"],redo1:["被退回就是規格寫錯。這次每一項都跟 Grace 一起量，不要再跳步驟。","聽說 KP 這次真的火了，連 Maggie 都不敢隨便說話。"],redo2:["重做的線拿給 Grace 測，這次不能省。","Amy 說她們這次特別加了一道檢查。"],ret4:["寄件方式要看客戶急不急：空運貴但快，一般出貨便宜但要等。先問 Kai 客戶能等多久。","Kai 說 Victor 已經天天催了。"],ret5:["收尾前，把這次的教訓寫成報告：規格怎麼確認、怎麼測、怎麼留紀錄。","聽說 Walter 想把這次的處理方式，變成公司的標準流程。"],c2a:["型錄要先弄清楚範圍：KP 要什麼、幾頁、給誰看。把決議寫下來。","聽說 Kai 這次丟單，是因為型錄上有一個舊數字。"],c2b:["啟動會議要留會議紀錄。決議寫下來，下次大家才不會各說各話。","Lena 最近又有新的方向，Zoe 已經改了三版。"],c2c:["規格要找 Ethan 確認最新版，不要拿舊資料。","Ethan 這週在改一個 ECN，有些規格可能剛剛變了。"],c2d:["第二次會議，有人會想加頁。拿出上次的紀錄，要加頁就要決定拿掉什麼。","Hank 說他有兩個客戶想要零售版的型錄。"],c2e:["要渲染圖，先給 Ian 一頁 brief。最好約 Lena 和 Ian 三個人一起對。","Ian 手上同時有三個部門的案子，排程很滿。"],c2f:["付印前，每個數字都再跟 Ethan 的最新規格對一次。","印刷廠說，晚一天送件，就要多等三天。"],c2g:["型錄交出去了。收尾時，把這次哪裡卡住寫下來，下次就能更快。","Kai 說有幾個客戶已經在問新型錄了。"],c3a:["EVT 是找問題，不是證明沒問題。問題列清單、分輕重，PVT 前必修的先修。包材先跟 Leo 談，再去工廠做落摔。","聽說副總很看重 QX-7。競爭對手也快推出類似的無風扇機種，市場預期今年這個品類會成長一成以上。"],c3b:["PVT 的老化測試是把早夭的機器先挑出來，不要急著縮短。","產線的 Ray 說，這批試產的產線比預期順。"],c3d:["上市了卻沒訂單，先別急著砸錢。去問 Kai 和 Hank，客戶到底卡在哪。","聽說 Hank 的零售客戶，最近在找沒有風扇的機器。"],c3e:["同一台機器可以換個產業賣。跨產業的商機，記得算成本與毛利。","聽說智慧交通那邊最近有標案，要找耐震、耐熱的工控機。"],c3f:["Nora 只看數字和下一步。先講累計的事實，再講計畫，不要只報好消息。","聽說 Nora 副總這季的目標，被董事會盯得很緊。"],c4a:["業務轉述的需求不一定完整。有疑問就直接跟客戶 Cora 確認，不要靠轉述。","聽說 Cora 他們公司今年要擴產，預算比去年多。"],c4b:["問供應商要問清楚客製的成本、NRE 和交期。Owen 會先喊高價，別直接接受。","Owen 說他們機殼廠這個月開模排程有空，可以壓一點價。"],c4c:["報價要用目標毛利率反推：售價 = 成本 ÷（1 − 毛利率）。先定底線再報。","聽說 Mia 說，這季毛利率太低的案子，要多簽一關。"],c4d:["Cora 會殺價。別直接降價，拿數量或付款條件換折扣，毛利率要守住底線。","Cora 的採購說，她們也在比別家的報價。"],c4e:["向 KP 報告時，先講毛利率和風險。毛利太低，不要等被問才講。","KP 今天心情看起來還可以。"]},PMX_IAN="我要的是一頁 Brief：要什麼、給誰看、幾張、什麼時候要。三句話就夠，不要丟一堆檔案給我。",PMX_VIS=["mia","ian","jay","zoe","sam","ella","hank","lena"],PMX_NOTIP={zoe:1,lena:1},PMX_ST
